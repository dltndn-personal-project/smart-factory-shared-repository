observation: |
  [전제]
  - 계약 변경은 DOCUMENT_CHANGE ISSUE-9f81b8ac-d26e-422b-aaed-02adad6ff320(같은 PR). 형식 원문은 그 변경 뒤의 INTERFACES·CONVENTIONS.
  - 근거와 세부: factory-simulator docs/spec/AGREEMENTS.md A-01~A-17(main@48b4b0a7f176c32e811a930c14abbcc600e275ea). 책임자 결정으로 이 파일이 구현 기준이고 다른 Component가 맞춘다.
  - 아래 [A-xx]는 AGREEMENTS 항목 ID.
  - 닫힌 Shared PR #3의 초안 MESSAGE ISSUE-dc1a761c-b170-453d-9ada-7b76eb436785를 대체한다(게시된 적 없음). 달라진 점은 제공 현황(구현 완료)이다.

  [factory-operations]
  1. Line Status `factory/line/status` 구독(QoS 1, retain). Dashboard Conveyor Status·Current Fault Level은 여기서 읽는다. `online:false`(LWT·정상 종료, 다른 필드 없음) 처리. [A-12]
  2. Conveyor Control 발행: `{"schema_version":1,"command":"STOP"|"START","command_id":..., "timestamp":..., "reason":...}`, QoS 1, retain false. 결과는 Line Status `last_command.command_id`·`result`(APPLIED|NO_CHANGE|REJECTED)로 확인. 응답 Topic 없음. retained 명령은 거부된다. [A-11]
  3. TimescaleDB 적재: 센서는 0.1초 chunk(3축 1,000샘플 배열) 단위. 권장 chunk당 한 행(`timestamp`, `sensor_id`, `seq`, `rpm`, `temperature`, 세 축 `real[]`, `fault_level`). 샘플 전개면 초당 10,000행. [A-03]
  4. 센서에 `fault_level` 없음. 필요하면 Line Status as-of join(chunk `timestamp` 이하 최신 Line Status, 없으면 null). Topic 간 도착 순서 보장 없음. [A-04]
  5. Product Created `timestamp`는 캡처 시각. 불량은 투입 시점 진동으로 결정되며 투입→캡처 약 13.3초. Time Lag 분석에 반영. [A-06]
  6. `product_id` 빈 번호 허용. production sequence = `product_id` 숫자 부분(별도 필드 없음). [A-09]
  7. (선택) 평가에 `ground_truth/products.jsonl` 사용 가능. 추론·판단 입력 금지. [A-08]

  [predictive-maintenance]
  1. Sensor Vibration chunk 파싱. 1초 윈도우 = 연속 `seq` 10개 이어 붙이기(BPFO 107.5 Hz 분해). `seq` 건너뜀 = 빈 구간, 감소 = 재기동. QoS 0이라 유실 가능. [A-01, A-03]
  2. `rpm == 0` chunk(정지 중, 노이즈만) 처리 방침 결정. 권장: 판정 보류, 직전 상태 유지. [A-05]
  3. 학습 데이터: `dataset-pdm` 산출물(`manifest.json` + `segments/*.npy`). factory-simulator 이미지로 직접 생성 가능(`docker run --rm -v "$PWD/pdm-data:/out" <이미지> dataset-pdm --out /out/<이름>`). 기본 Fault Level 0~10 각 120초, 약 158 MB. 라벨은 구간 단위 `fault_level`·`severity`. Equipment State 대응과 윈도우 분할은 PdM이 정한다. [A-13]
  4. PdM Inference 100 ms 측정 구간: 윈도우의 마지막 센서 메시지 수신 → PdM Result 발행. [A-14]
  5. PdM Result 등 자기 Payload에도 CONVENTIONS 공통 규칙 적용 권장(밀리초 timestamp, `schema_version`, 대문자 Equipment State). [A-02]

  [vision-inspection]
  1. Product Created 파싱: `schema_version`, `product_id`, 밀리초 `timestamp`, `image_path`. 모르는 필드 무시. QoS 1. [A-01, A-06]
  2. 이미지 전제: JPEG 640×640, 칩 하나가 중앙 근처, 결함은 윗면만. `products/`의 점 파일(`.P-*.jpg.tmp`) 무시. [A-07]
  3. factory-simulator는 Vision 학습·평가 전용 이미지를 만들지 않는다(`training/`, `evaluation/` 미기록). 학습 데이터 출처는 vision-inspection이 정한다. [A-15]
  4. (선택) runtime 이미지 + `ground_truth/products.jsonl`의 `bbox`·`defect_type`로 오프라인 평가·학습 데이터 구성 가능. Fault Level 10(불량 60%)과 설정 `render.randomization.enabled: true`로 수집. 속도는 분당 30개 고정(시간 가속 없음). [A-16]
  5. `gradcam/`을 쓰려면 볼륨 쓰기 권한 마운트가 필요하다(integration과 조율). [A-17]

  [integration]
  1. compose: `eclipse-mosquitto:2.1.2-alpine`(`-c /mosquitto-no-auth.conf`, 익명, 1883). factory-simulator 서비스: 저장소 루트 Dockerfile 빌드, env `MQTT_URL=mqtt://mosquitto:1883`, `IMAGE_ROOT=/data`, 포트 `127.0.0.1:8000:8000`, root 실행. [A-17]
  2. Image Storage: Docker named volume(호스트 bind mount 금지). factory-simulator·vision-inspection(gradcam) 쓰기, 나머지 `:ro`. [A-07, A-17]
  3. 기동 확인 `GET http://factory-simulator:8000/healthz` 200(이미지 HEALTHCHECK도 같은 주소). Broker가 늦게 떠도 재연결한다. [A-17]
  4. 초기화: 볼륨과 DB를 함께 지운다(볼륨을 지우면 `product_id`가 1부터 다시 시작). [A-09]
  5. 제품 이미지는 브라우저 화면이 열려 있는 동안만 생긴다. 브라우저 없는 E2E는 센서·Line Status만 나온다. 제품 흐름 자동 검증은 `scripts/fake_renderer.py`(이미지에 포함): `docker compose exec -T factory-simulator python scripts/fake_renderer.py --url http://127.0.0.1:8000 --count 3`. 성공하면 종료 코드 0, stdout 한 줄 `{"product_ids": [...]}`. 불량 제품까지 보려면 Fault Level을 먼저 올린다(검증 보조 로컬 HTTP `PUT /api/fault-level {"value": 10}`. runtime Component는 이 HTTP API를 호출하지 않는다). [A-17]
  6. Interface 준수 검사: MQTT Payload에 Ground Truth 필드(INTERFACES Ground Truth 표)가 없는지. PdM 100 ms는 A-14 구간으로 측정. [A-08, A-14]
  7. 참고 절차: factory-simulator `scripts/smoke.py`(`make smoke`)가 위 1~5를 단독 compose로 확인한다(기동 30초 안 healthz, 센서 3초 30±3개, retained Line Status, 가짜 렌더러 3건의 Product Created·이미지·Ground Truth, STOP/START 결과, `down -v`).

  [제공 현황 (factory-simulator main@48b4b0a 기준, 지금 사용 가능)]
  - 구현 완료: 자동 task 17개(SRV-1~7, WEB-1~3, ASSET-1~5, RUN-1~2, PR #5~#22) merge.
  - MQTT: Sensor Vibration(`factory/sensor/motor01/vibration`, 0.1초 chunk), Product Created, Line Status(retain, LWT `online:false`, 정상 종료 시 offline 발행) 발행. Conveyor Control 수신(START·STOP 적용, retained·잘못된 명령 REJECTED, 결과는 Line Status `last_command`).
  - 파일: 제품 이미지 `products/`, runtime Ground Truth `ground_truth/products.jsonl`.
  - PdM 데이터셋: `python -m factory_simulator dataset-pdm --out <폴더>`(저장소 루트, `make venv` 뒤 `server/.venv/bin/python`) 또는 Docker 이미지(entrypoint가 `python -m factory_simulator`라 인자만 준다). 같은 commit·설정·seed면 바이트 단위로 같다.
  - 실행: 루트 `Dockerfile`(web 빌드 포함 단일 이미지), 로컬 `compose.yaml`(Mosquitto 2.1.2-alpine + factory-simulator + named volume `image-storage`). 로컬 compose는 단독 개발·시연용이며 broker 설정은 `docker/mosquitto.conf`(익명, persistence false)를 쓴다. 시스템 compose는 integration 소유. 보조 스크립트 `scripts/conveyor.sh`, `scripts/mqtt_watch.sh`, `scripts/fake_renderer.py`, `make smoke`.
  - 검증: 실제 broker 연동 테스트(SRV-6)와 compose smoke(RUN-2)가 task 검증을 통과했다.
  - 남은 것: 책임자의 브라우저 확인(HUM-1)과 5분 시연 리허설(HUM-2). 브라우저 렌더링 품질(결함 모양, bbox 정확도)은 아직 사람이 확인하지 않았다. 이미지 형식·크기와 파일·MQTT 흐름은 자동 검사로 확인됨.

  [I-1, I-4와의 관계]
  - I-1 requested_action (3) "Simulator의 Vision 학습 데이터셋 생성 유지 여부": 생성하지 않는다(A-15, 책임자 확정).
  - I-1 pass-through: 현재 약속에서 runtime 결함 정보는 Product Created에 없고(A-06), Ground Truth 파일은 평가·검증 전용이다(A-08). pass-through를 채택하면 불량 정보 전달 경로를 I-2 등에서 별도로 정해야 하며, 이 Issue는 그것을 정하지 않는다.
  - I-1 requested_action (2) 승인 책임자 지정은 ISSUE-95d74411…(@dltndn)으로 해결됨.
  - I-4 답: Q-6 밀리초 3자리 고정. Q-7 factory-simulator 4개 Topic의 QoS·retain 확정(공통 client id 규칙은 없음. factory-simulator client_id는 `factory-simulator`). Q-9 유일성 범위 = Image Storage 볼륨 수명, production sequence = `product_id` 숫자 부분이라 Vision Result에 따로 실을 필요 없음. Q-12 Docker Compose + named volume(마운트 경로는 integration). Q-14 생산 속도 분당 30개(2초에 1개), 시간 가속 없음.
  - I-4 미답: Q-9 형식 불일치 처리, Q-11 Inspection Image, Q-14 Vision 지연 목표, Q-15 Vision 오류 표현, Q-17 6절 그림 문구, Vision 처리 시각 필드. factory-simulator 약속 범위 밖이다.
