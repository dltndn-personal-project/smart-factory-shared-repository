reason: |
  생산자인 factory-operations가 Alarm Event의 형식과 발행 조건을 확정했다. 이를 Shared 계약에 올려 integration이 E2E·Interface 준수 검사의 기준으로 쓰게 한다.
  - 근거: factory-operations `docs/spec/AGREEMENTS.md` A-02(생산자 확정본), A-01(Topic·QoS·retain 표), A-12(Ground Truth 사용 제한) (main@ffb2c4c66749c26449b547cb0e805d485c0ca85e, spec PR #3 merge). 규칙 세부 `docs/spec/03-control.md` 4절, 결정 이유 `DECISIONS.md` D-21·D-22.
  - 조율 결정(책임자 위임, 2026-09-27): C-04(Alarm Event는 factory-operations가 생산자로 확정하고, 외부 소비자가 없으면 Topic 발행 여부도 정한다), C-15(`factory/alarm/event`로 발행, QoS 1, retain false. 소비자는 integration E2E뿐이지만 발행 비용이 작다), C-20(게시 방식).
  - 현재 계약: INTERFACES 목록의 Alarm Event는 Topic과 생산자만 있고 소비자·QoS·retain·Payload Schema·상태가 "미정"이다. ARCHITECTURE 4.4 Alarm Management는 Warning·Critical을 반드시 알람 대상으로 하고 Alarm History를 DB에 저장한다고만 정한다.
  - Alarm Event의 값은 PdM Result에서 온다(`timestamp`, `sensor_id`, `health_index`, `anomaly_score`, `state`). 그래서 같은 PR의 ISSUE-2aa576c7…(PdM Result 확정)을 related_issues로 연결했다. 두 Issue는 게시 주체(생산자)가 달라 나누었다.
  - 이 변경은 factory-operations 구현을 정당화하려는 것이 아니다. factory-operations에는 아직 runtime 구현이 없고 contract_ref는 null이다. merge 뒤 OPS-10 task가 이 merge commit을 contract_ref로 채택한다.
changed_documents:
  - file: docs/INTERFACES.md
    section: "머리말(확정 Interface 목록), Interface 목록 Alarm Event 행, Alarm Event(신설)"
change:
  before: |
    - INTERFACES: Alarm Event는 Topic `factory/alarm/event`, 생산자 factory-operations만 있고 소비자·QoS·retain·Payload Schema·상태가 미정. Alarm Event 절 없음.
  after: |
    - INTERFACES Alarm Event 확정(schema_version 1, `factory/alarm/event`, QoS 1, retain false). 소비자: 없음(integration이 E2E 검증에서 관찰).
      - 필수 `schema_version`, `alarm_id`(UUID4 소문자 36자, Alarm History 기록과 같은 값), `timestamp`(원인 PdM Result의 `timestamp` 그대로), `raised_at`(factory-operations 판정 시각), `sensor_id`, `severity`(`WARNING` | `CRITICAL`, 새 Equipment State), `previous_state`(Equipment State 또는 null), `health_index`, `anomaly_score`(원인 PdM Result의 값).
      - 발행 조건: 같은 `sensor_id`의 이전 상태보다 심각도가 높은 `WARNING`·`CRITICAL` PdM Result(첫 결과 포함), 심각도 `NORMAL` < `CAUTION` < `WARNING` < `CRITICAL`. `CAUTION` 진입·회복은 발행하지 않는다. 라인 재가동(Line Status `STOPPED` → `RUNNING`)이면 라인 센서의 이전 상태를 비우고 재가동 전 윈도우의 결과는 쓰지 않는다. 같은 상태가 이어지면 다시 보내지 않고 떨림 억제·ack·해제 이벤트는 없다.
      - 발행 전제(Alarm History 기록 요청 뒤, DB 완료를 기다리지 않음, MQTT 끊김 시 발행 안 함), 순서(같은 PdM Result의 Interlock STOP보다 먼저 발행, 수신 순서는 보장 안 함), 중복·재전송 없음, 오류 표현(오류 이벤트 없음), Ground Truth 미포함과 `severity` 이름 구분, integration 검사 항목과 거부 예.
    - INTERFACES 목록: Alarm Event 행을 소비자 "없음 (integration이 E2E 검증에서 관찰)", QoS 1, retain false, 근거 4.4 Alarm Management·17, 확정으로. 머리말 확정 목록에 Alarm Event 추가.
compatibility: |
  확정 Interface의 형식·의미는 바꾸지 않는다. 후보·미정이던 Alarm Event가 확정된다. 이 형식과 다른 확정 구현은 없다고 판단한다(factory-operations runtime 구현 전, 다른 Component는 이 Topic을 구독하지 않는다).
  - factory-simulator: 영향 없음. Alarm Event를 구독하지 않는다. 발행 조건이 Line Status(확정)의 `conveyor` 전이를 읽을 뿐 Line Status 형식을 바꾸지 않는다.
  - vision-inspection: 영향 없음. Alarm Event를 구독하지 않는다.
  - predictive-maintenance: 영향 없음. Alarm Event를 구독하지 않는다. Alarm Event는 PdM Result(같은 PR의 ISSUE-2aa576c7…)의 `timestamp`, `sensor_id`, `state`, `health_index`, `anomaly_score`를 그대로 싣는다. factory-operations A-05가 기대한 PdM Result의 형식·의미와 PdM spec A-01이 모순 없음을 확인했다(ISSUE-2aa576c7… compatibility).
  - integration: 계약 검사 대상 추가. E2E(7.3 Production Control Flow)에서 이 Topic을 관찰하고, Interface 준수 검사(필수 필드·타입, `alarm_id` 형식, timestamp 정규식, `severity`·`previous_state` 값)와 Ground Truth 필드 부재 검사에 Alarm Event를 넣는다. Alarm Event의 `severity`는 문자열 Equipment State이므로 Ground Truth `severity`(숫자)와 타입으로 구분해 검사한다. Alarm Event와 Interlock STOP의 수신 순서로 판정하지 않는다.
  - factory-operations: 생산자. spec AGREEMENTS A-02와 같은 내용이므로 구현 기준은 바뀌지 않는다. merge 뒤 OPS-10에서 이 commit을 contract_ref로 채택한다.
  - 정리한 표현: AGREEMENTS의 Component 내부 참조(DB 테이블 `alarm.alarm_id`, `03-control.md`)는 ARCHITECTURE 4.4 Data Persistence의 Alarm History로 바꿨다. `03-control.md` 4절의 "재가동 뒤 다시 WARNING·CRITICAL이 되면 새 Alarm", "factory-operations는 State를 다시 계산하지 않는다"를 한 문장씩 옮겼다. 호환성 검증 항목과 거부 예(`severity: "CAUTION"`, `alarm_id` 없음)는 AGREEMENTS 필드 표에서 도출해 INTERFACES 작성 항목(정상·오류 예제와 호환성 검증 방법)을 채웠다. 의미는 바꾸지 않았다.
  - I-4(ISSUE-63f6789a…) Q-7의 QoS·retain 질문에 Alarm Event에 대해 답한다. Q-15(오류 표현)는 Alarm Event에 대해 "오류 이벤트 없음, 발행 실패는 로그"로 답한다.
transition:
  adoption: |
    계약 변경 승인 책임자(@dltndn, ISSUE-95d74411…) 승인 후 merge(조율 C-01에 따라 조율 agent가 merge). merge 뒤 factory-operations(OPS-10)와 integration이 이 merge commit을 contract_ref로 채택한다. 다른 Component는 이 Topic을 쓰지 않으므로 채택이 필요 없다.
    검증: factory-operations는 단위 테스트(발행 Payload의 키 집합·값·timestamp 형식)와 Docker 연동 smoke(PdM `CRITICAL` 뒤 Alarm Event 수신, DB `alarm` 한 행)로 이 필드 표를 검사한다(spec `08-verification.md`). 시스템 호환은 integration이 COMPOSITION.json에 고정한 조합에서 7.3 E2E(`CRITICAL` PdM Result 뒤 Alarm Event 관찰, `alarm_id`로 Alarm History 한 행 확인)와 Interface 준수 검사로 확인한다.
  rollback: |
    ARCHITECTURE 19절 복구 방법: 마지막으로 검증된 Component commit 조합과 계약 commit(d0c997c97129141d9853a42ce6e0d1f8f7309ae9)으로 되돌린다. 운영 기간이므로 되돌리는 변경도 새 DOCUMENT_CHANGE로 게시한다. factory-operations 구현은 spec AGREEMENTS A-02를 따르므로 계약만 되돌리면 구현과 계약이 다시 어긋난다. 되돌릴 때는 AGREEMENTS A-02 수정 여부를 함께 결정한다.
