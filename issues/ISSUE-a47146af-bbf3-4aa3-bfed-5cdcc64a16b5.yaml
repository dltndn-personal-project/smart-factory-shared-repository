observation: |
  [제안 배경 - 사실]
  - 2026-09-24 vision-inspection 사용자 결정: 이번 프로젝트에서 Vision Quality Inspection은 AI 모델 판정을 하지 않는다.
    YOLOv8/EfficientDet 결함 검출, Grad-CAM, 모델 학습·평가를 모두 제외한다.
  - 근거: 과제 출제자의 승인을 받았다(사용자 진술). ARCHITECTURE 16절(Simulator를 Three.js로 바꾼 일)과 같은
    "출제자 승인" 형식으로 기록할 것을 제안한다. 승인 증빙 자체는 이 Issue에 첨부하지 않았다.
  - 대신 Vision은 Simulator가 보낸 불량 여부·결함 유형을 그대로 검사 결과(Vision Result)로 발행하는 pass-through 중계를 맡는다.
    입력 수신·검증, 이미지 참조, ID·Timestamp 정책, 결과 발행, 다운스트림 인터페이스 유지는 원래대로 설계한다.
  - vision-inspection에는 아직 구현이 없고 contract_ref는 null이다. 이 제안은 구현을 정당화하려는 계약 변경이 아니라
    범위 결정에 따른 계약 정합 요청이다. 구현은 Shared 승인 뒤에 시작한다.

  [영향 받는 Shared 계약 절 (ref 6bcd2aad8e374a7e96f816051585a49cb5e30f86 기준)]
  - ARCHITECTURE 2절: Vision Model mAP@0.5 >= 0.80, Vision Inference 20 FPS ("반드시 충족하고 측정")
  - ARCHITECTURE 4.3절: Role, Processing Pipeline(YOLOv8/EfficientDet, Grad-CAM), Output
  - ARCHITECTURE 7.2절: Vision Inspection Flow의 Inference, Grad-CAM 단계
  - ARCHITECTURE 17절: Defect Detection, Grad-CAM 행 / 18절: "Quality Intelligence"
  - ARCHITECTURE 19.1절: integration의 통합 환경 Vision FPS 측정과 모델 지표 수집
  - ARCHITECTURE 4.1절: Vision Dataset Generation(Domain Randomization)
  - INTERFACES Image Reference: training/, evaluation/ 디렉터리의 vision-inspection 읽기 행
  - ARCHITECTURE 19절: "계약 변경 승인 책임자: 미정", Shared .github/CODEOWNERS의 placeholder

  [제안 내용]
  1. 위 절의 Vision AI 판정, Grad-CAM, Vision 성능 기준, integration의 Vision 측정 항목을 "현재 범위 제외"로 표시한다.
     모델 판정 복귀는 필요해지면 새 DOCUMENT_CHANGE로 제안한다(이 문구는 DOCUMENT_CHANGE의 change.after/compatibility에 둔다).
     DOCUMENT_CHANGE의 transition.rollback은 ARCHITECTURE 19절 복구 방법(마지막으로 검증된 Component commit 조합과 계약 commit으로 되돌림)을 따른다.
  2. ARCHITECTURE 19절의 계약 변경 승인 책임자를 vision-inspection 사용자(이번 결정을 내린 사용자) 본인으로 지정하고,
     Shared .github/CODEOWNERS의 placeholder를 그 GitHub 계정으로 바꾼다. 실제 계정 표기는 승인 책임자가 확정한다.
  3. Vision 입력(불량 정보 전달 방식, Ground Truth 정책)과 출력(Vision Result 필드, 판정 출처 표시)은 이 Issue가 merge된 뒤
     별도 MESSAGE(I-2, I-3)로 제기한다. 이 Issue에서는 범위와 성능 기준만 다룬다.

  [다른 Component에 주는 영향 (추정, 각 Component 확인 필요)]
  - factory-simulator: Vision 학습 데이터셋 생성(4.1절)이 계속 필요한지 결정이 필요하다. 불량 정보 전달 방식은 I-2에서 다룬다.
  - factory-operations: Vision Result의 defect 값이 AI 판정이 아닌 Simulator 전달값이 된다. 필드 처리는 I-3에서 다룬다.
  - integration: 2절·19.1절의 Vision mAP, 통합 환경 Vision FPS 측정 대상이 사라진다.
  - predictive-maintenance: 영향 없음으로 판단한다(2절의 PdM 기준은 그대로다).

  [초기화 기간 관련 사실]
  - 게시 시점 issues/index.json은 비어 있다. 이 Issue가 첫 운영 Issue로 merge되면 초기화 기간이 끝나고, 이후 docs/ 변경에는
    DOCUMENT_CHANGE가 필요하다(Shared AGENTS.md). 승인 책임자가 CODEOWNERS에 없으면 그 DOCUMENT_CHANGE를 승인할 사람이 없다.
    따라서 제안 2(ARCHITECTURE 19절, CODEOWNERS 지정)는 이 Issue보다 먼저 반영하는 것을 권장한다.

  [불확실한 부분]
  - 과제 출제자 승인의 범위(mAP·FPS 측정 면제, Simulator 학습 데이터셋 생성 포함 여부)는 사용자 진술 외 증빙이 없다.
  - 전환·검증 조건의 세부는 합의 후 DOCUMENT_CHANGE에서 정한다.
