summary: "Vision AI 판정을 현재 범위에서 제외(pass-through)하고 Vision Result Interface를 확정"
attention:
  - factory-operations
  - integration
  - factory-simulator
related_issues:
  - ISSUE-a47146af-bbf3-4aa3-bfed-5cdcc64a16b5
  - ISSUE-63f6789a-a26b-42a4-8b3c-3dcfeaa07e1f
