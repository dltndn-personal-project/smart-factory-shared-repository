reason: |
  I-1(ISSUE-a47146af…)이 제안한 범위 축소를 계약 문서에 반영한다.
  - 근거: 과제 출제자의 승인(사용자 결정 D-2, 2026-09-24). ARCHITECTURE 16절(Simulator 변경)과 같은 "출제자 승인" 형식으로 적는다.
  - 사용자 결정(2026-09-24~27, vision-inspection docs/ARCHITECTURE.md 11.3절 D-1~D-12, https://github.com/dltndn-personal-project/smart-factory-vision-inspection/blob/4eff75a447cc761abf8a3185e262a53b9f015574/docs/ARCHITECTURE.md): Vision AI 판정(YOLOv8/EfficientDet 검출, Grad-CAM, 학습·평가)과 2절 Vision 성능 기준을 "현재 범위 제외"로 하고, Vision은 Simulator 불량 정보를 Vision Result로 옮기는 pass-through를 맡는다.
  - 출력 결정: Vision Result는 A§4.3 필드를 유지한다. `confidence`, `bbox`, `gradcam_path`는 키를 두고 null이다(D-7, D-8). 선택 필드 `judgement_source`로 전달값임을 표시한다(D-9). `gradcam/`과 Dashboard Grad-CAM 항목은 유지하되 비어 있다(D-10).
  - I-1 이후 merge된 계약(ISSUE-9f81b8ac…)이 CONVENTIONS 공통 규칙(schema_version, 밀리초, 소문자 결함 유형, 대문자 열거값, px 좌표, 오류 표현)을 정했으므로 Vision Result를 그 규칙으로 적는다. D-9의 값은 열거값 대문자 규칙에 따라 `PASS_THROUGH`로 쓴다.
  - 이 변경은 vision-inspection 구현을 정당화하려는 것이 아니다. vision-inspection에는 아직 구현이 없고 contract_ref는 null이며, 구현은 이 계약이 승인된 뒤 시작한다.
  - 이 Issue에 넣지 않은 것: Vision이 불량 정보를 받는 경로(I-1이 예고한 I-2). ISSUE-9f81b8ac…이 Product Created에서 결함 정보를 빼고 `ground_truth/products.jsonl`을 평가·검증 전용으로 정했기 때문에, 전달 경로(별도 MQTT Topic 또는 Ground Truth 파일 읽기)를 다시 결정해야 한다. 그 결정은 후속 DOCUMENT_CHANGE로 올린다.
changed_documents:
  - file: docs/ARCHITECTURE.md
    section: "2절 Vision 성능 기준, 3.4 Ground Truth 사용 목적, 4.3 현재 범위(신설)·Output·Out of Scope, 4.4 Data Integration(Vision)·Dashboard, 7.2 Vision Inspection Flow, 8절 Vision 현재 범위 예외, 17절 Defect Detection·Grad-CAM 행, 18절 Vision, 19.1 Vision FPS·mAP"
  - file: docs/INTERFACES.md
    section: "머리말, Interface 목록 Vision Result 행, Vision Result(신설), Image Reference training/·evaluation/·gradcam/ 행, Ground Truth integration 검사 예외"
  - file: docs/CONVENTIONS.md
    section: "Ground Truth"
change:
  before: |
    - Vision은 YOLOv8/EfficientDet으로 결함을 검출하고 Grad-CAM을 만든다(4.3, 7.2, 17). 2절 Vision mAP@0.5 ≥ 0.80, 20 FPS를 반드시 충족·측정한다. integration은 통합 환경 Vision FPS를 측정하고 mAP를 수집한다(19.1).
    - Vision Result: Topic 후보, QoS·retain·Payload Schema 미정(INTERFACES).
    - Ground Truth는 MQTT로 전달하지 않으며 예외가 없다(8절, INTERFACES Ground Truth, CONVENTIONS).
  after: |
    - 4.3에 "현재 범위" 절 신설: 과제 출제자 승인으로 Vision AI 판정, Grad-CAM, 학습·평가, 2절 Vision 성능 기준은 현재 범위 제외. Vision은 Simulator 불량 정보를 Vision Result로 옮긴다(pass-through). 모델 판정 복귀는 새 DOCUMENT_CHANGE로 제안한다. 원래 Pipeline·Output 설계는 남기되 현재 범위에서는 적용하지 않는다.
    - 2, 7.2, 17, 18, 19.1, 4.4 Dashboard·Data Integration에 현재 범위 표시(제외 또는 비어 있음)를 붙인다.
    - INTERFACES Vision Result 확정(schema_version 1, `factory/vision/result`, QoS 1, retain false): 필드 `schema_version`, `product_id`, `timestamp`(Product Created 값 유지), `defect`, `defect_type`, `confidence`(null), `bbox`(null), `image_path`, `gradcam_path`(null), 선택 `judgement_source`(`PASS_THROUGH`). 값이 없어도 키는 남긴다. 잘못된 입력은 발행하지 않고 로그로 남긴다.
    - Ground Truth 현재 범위 예외: Vision Result의 `defect`, `defect_type`은 Ground Truth와 같은 값이며 MQTT로 전달된다. AI 추론 입력에 Ground Truth를 넣지 않는 규칙은 그대로다. integration 검사는 이 두 필드를 예외로 한다(8절, INTERFACES Ground Truth, CONVENTIONS, 3.4).
    - Image Reference: `training/`·`evaluation/`은 현재 범위에서 쓰지 않고, `gradcam/`은 유지하되 비어 있다.
compatibility: |
  Breaking change다(2절 성능 기준과 4.3 책임이 바뀌고, 후보였던 Vision Result가 확정된다). 기존 확정 구현은 없다고 판단한다. vision-inspection 구현은 없고, Vision Result는 후보·미정이었다.
  - factory-operations: Vision Result를 이 형식으로 구독한다(schema_version, 모르는 필드 무시). `confidence`, `bbox`, `gradcam_path`의 null과 Dashboard Confidence·Grad-CAM Result의 "비어 있음" 표시를 처리한다. Vision Result의 결함 값은 AI 판정이 아니라 Simulator 전달값이다(`judgement_source: "PASS_THROUGH"`). 이 값을 설비-품질 상관분석(4.4)에 쓸 때 17절의 "Ground Truth는 Operations 평가 전용"과 어떻게 해석할지는 factory-operations와 승인 책임자가 확인해 주길 요청한다. 5.3절 Vision Inspection 최소 필드(`defect` 없음 등)는 factory-operations 소유라 이 변경에서 고치지 않았다.
  - integration: 2절·19.1절의 Vision FPS 측정과 Vision mAP 수집 대상이 없어진다. Ground Truth 검사에서 Vision Result `defect`, `defect_type`을 예외로 둔다. vision-inspection은 `gradcam/`에 쓰지 않으므로 Image Storage를 읽기 전용으로 마운트해도 된다(쓰기 권한은 모델 판정 복귀 때 필요).
  - factory-simulator: 이 변경만으로는 바뀌는 구현이 없다. 불량 정보 전달 경로가 정해지면(후속 DOCUMENT_CHANGE) 영향이 생길 수 있다.
  - predictive-maintenance: 영향 없음(2절 PdM 기준, 4.2 그대로).
  - 현재 범위 표시는 "제외"와 "비어 있음"을 원래 설계 옆에 붙이는 방식이다. 모델 판정으로 돌아갈 때는 새 DOCUMENT_CHANGE로 표시를 지운다.
  - I-4(ISSUE-63f6789a…)와의 관계: Vision 처리 시각 필드는 두지 않는다(Vision Result timestamp). Vision의 오류 표현은 CONVENTIONS 오류 표현을 따른다(오류 결과 메시지 없음). Q-11(Inspection Image), Q-17(6절 그림 문구), Vision 결과 지연 목표는 이 변경에서 정하지 않는다.
transition:
  adoption: |
    계약 변경 승인 책임자(@dltndn) 승인 후 merge. vision-inspection은 불량 정보 전달 경로의 DOCUMENT_CHANGE까지 merge된 뒤 그 commit을 contract_ref로 채택하고 구현을 시작한다. factory-operations는 Shared 검토에서 이 Issue를 확인하고 Vision Result 구독을 이 형식으로 맞춘다.
    검증: 구현 뒤 integration이 COMPOSITION.json에 고정한 조합에서 7.2 흐름 E2E로 확인한다(Vision Result 형식, null 필드, `judgement_source`, Ground Truth 검사 예외).
  rollback: |
    ARCHITECTURE 19절 복구 방법: 마지막으로 검증된 Component commit 조합과 계약 commit(8b1efb06325f711814152f4867d86e4413b4a404)으로 되돌린다. 운영 기간이므로 되돌리는 변경도 새 DOCUMENT_CHANGE로 게시한다. vision-inspection 구현이 아직 없으므로 되돌릴 Component 구현은 없다.
