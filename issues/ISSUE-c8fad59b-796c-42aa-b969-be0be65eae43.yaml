reason: |
  I-1(ISSUE-a47146af…)이 제안한 범위 축소를 계약 문서에 반영하고, pass-through가 실제로 동작하는 입력 경로를 함께 정한다.
  - 근거: 과제 출제자의 승인(사용자 결정 D-2, 2026-09-24). ARCHITECTURE 16절(Simulator 변경)과 같은 "출제자 승인" 형식으로 적는다.
  - 사용자 결정(vision-inspection docs/ARCHITECTURE.md 11.3절 D-1~D-12, https://github.com/dltndn-personal-project/smart-factory-vision-inspection/blob/4eff75a447cc761abf8a3185e262a53b9f015574/docs/ARCHITECTURE.md):
    Vision AI 판정(YOLOv8/EfficientDet 검출, Grad-CAM, 학습·평가)과 2절 Vision 성능 기준을 "현재 범위 제외"로 하고, Vision은 Simulator 불량 정보를 Vision Result로 옮기는 pass-through를 맡는다.
    Vision Result는 A§4.3 필드를 유지하되 `confidence`, `bbox`, `gradcam_path`는 null(D-7, D-8), 선택 필드 `judgement_source`로 전달값임을 표시한다(D-9, CONVENTIONS 열거값 규칙에 따라 `PASS_THROUGH`). `gradcam/`과 Dashboard Grad-CAM 항목은 유지하되 비어 있다(D-10).
  - 입력 경로 결정(사용자 D-6 재결정, 2026-09-27): Vision은 Product Created를 받은 뒤 `ground_truth/products.jsonl`에서 같은 `product_id` 줄을 읽어 `defect`, `defect_type`을 얻는다.
    I-1 당시 안(별도 MQTT Topic으로 불량 정보 전달)은 폐기했다. ISSUE-9f81b8ac…이 Ground Truth를 MQTT로 전달하지 않고 파일로만 두기로 정했기 때문에, 그 규칙과 factory-simulator 구현을 바꾸지 않는 이 경로를 택했다.
  - 두 결정을 한 Issue로 올리는 이유: 범위 축소·Vision Result만으로는 Vision이 결과를 발행할 수 없고, 두 변경이 ARCHITECTURE 3.4·4.3·8절, INTERFACES Vision Result·Ground Truth, CONVENTIONS Ground Truth의 같은 문장을 고친다. 한 번에 승인·채택되어야 계약이 일관된다.
  - 이 변경은 vision-inspection 구현을 정당화하려는 것이 아니다. vision-inspection에는 아직 구현이 없고 contract_ref는 null이며, 구현은 이 계약이 승인된 뒤 시작한다.
  - 닫힌 Shared PR #5의 초안 ISSUE-e156d982-4404-4802-ab33-fde74fde09b9를 대체한다. 그 ID는 merge되지 않아 게시된 적이 없고 재사용하지 않는다.
changed_documents:
  - file: docs/ARCHITECTURE.md
    section: "2절 Vision 성능 기준, 3.4 Ground Truth 사용 목적, 4.3 현재 범위(신설)·Output·Out of Scope, 4.4 Data Integration(Vision)·Dashboard, 7.2 Vision Inspection Flow, 8절 Vision 현재 범위 예외, 17절 Defect Detection·Grad-CAM·Ground Truth 생성 행, 18절 Vision, 19.1 Vision FPS·mAP"
  - file: docs/INTERFACES.md
    section: "머리말, Interface 목록 Vision Result 행, Vision Result(신설), Image Reference ground_truth/·training/·evaluation/·gradcam/ 행, Ground Truth 용도 예외·integration 검사"
  - file: docs/CONVENTIONS.md
    section: "Ground Truth"
change:
  before: |
    - Vision은 YOLOv8/EfficientDet으로 결함을 검출하고 Grad-CAM을 만든다(4.3, 7.2, 17). 2절 Vision mAP@0.5 ≥ 0.80, 20 FPS를 반드시 충족·측정한다. integration은 통합 환경 Vision FPS를 측정하고 mAP를 수집한다(19.1).
    - Vision Result: Topic 후보, QoS·retain·Payload Schema 미정.
    - Ground Truth(`ground_truth/products.jsonl`)는 평가·검증 전용이고, AI 추론 입력으로 읽지 않으며, MQTT로 전달하지 않는다. 예외가 없다(3.4, 8절, INTERFACES Ground Truth·Image Reference, CONVENTIONS).
  after: |
    - 4.3에 "현재 범위" 절 신설: 과제 출제자 승인으로 Vision AI 판정, Grad-CAM, 학습·평가, 2절 Vision 성능 기준은 현재 범위 제외. 모델 판정 복귀는 새 DOCUMENT_CHANGE로 제안한다. 원래 Pipeline·Output 설계는 남기되 현재 범위에서는 적용하지 않는다.
    - 입력 경로: Vision은 Product Created(`product_id`, `timestamp`, `image_path`)를 구독하고, `ground_truth/products.jsonl`에서 같은 `product_id`의 완성된 줄을 읽기 전용으로 찾아 `defect`, `defect_type`만 쓴다. 나머지 Ground Truth 필드는 쓰지 않는다. 줄이 없거나 읽지 못하면 발행하지 않고 로그로 남긴다.
    - Ground Truth 현재 범위 예외: 이 읽기는 추론 없는 판정값 전달이므로 "AI 추론 입력으로 읽지 않는다" 원칙의 대상이 아니다. Vision Result의 `defect`, `defect_type`은 Ground Truth와 같은 값으로 MQTT에 실린다. Product Created 등 AI 추론 입력에 Ground Truth를 넣지 않는 규칙과 Ground Truth 파일을 MQTT로 보내지 않는 규칙은 그대로다(3.4, 8, 17절, INTERFACES Ground Truth·Image Reference, CONVENTIONS).
    - INTERFACES Vision Result 확정(schema_version 1, `factory/vision/result`, QoS 1, retain false): `schema_version`, `product_id`, `timestamp`(Product Created 값 유지), `defect`, `defect_type`, `confidence`(null), `bbox`(null), `image_path`, `gradcam_path`(null), 선택 `judgement_source`(`PASS_THROUGH`). 값이 없어도 키는 남긴다.
    - integration 검사: Vision Result `defect`, `defect_type`은 예외, Vision의 파일 읽기는 MQTT 검사 대상이 아니며, Vision Result에 `fault_level`, `severity`, `defect_probability`, `defect_params`, `render_seed`가 없는지 확인한다.
    - 2, 7.2, 17, 18, 19.1, 4.4 Dashboard·Data Integration, Image Reference `training/`·`evaluation/`·`gradcam/`에 현재 범위 표시(제외 또는 비어 있음).
compatibility: |
  Breaking change다(2절 성능 기준과 4.3 책임, Ground Truth 사용 규칙이 바뀌고, 후보였던 Vision Result가 확정된다). 기존 확정 구현은 없다고 판단한다. vision-inspection 구현은 없고 Vision Result는 후보·미정이었다.
  - factory-simulator: 바뀌는 구현이 없다. ISSUE-9f81b8ac…의 약속(Product Created에 결함 정보 없음, Ground Truth는 파일 전용·MQTT 미전달, 기록자는 factory-simulator 하나, Product Created는 이미지와 Ground Truth 기록이 끝난 뒤 발행, 완성되지 않은 마지막 줄은 읽는 쪽이 무시)을 그대로 전제로 쓴다. 새로 생기는 의존은 "Vision이 이 파일을 읽는다"는 것이며, 파일 형식·위치·기록 순서를 바꾸면 Vision에 영향이 있다.
  - factory-operations: Vision Result를 이 형식으로 구독한다(schema_version, 모르는 필드 무시). `confidence`, `bbox`, `gradcam_path`의 null과 Dashboard Confidence·Grad-CAM Result의 "비어 있음" 표시를 처리한다. Vision Result의 결함 값은 AI 판정이 아니라 Ground Truth에서 옮긴 값이다(`judgement_source: "PASS_THROUGH"`). 이 값을 설비-품질 상관분석(4.4)에 쓸 때 17절의 "Ground Truth는 Operations 평가 전용"과 어떻게 해석할지 factory-operations와 승인 책임자가 확인해 주길 요청한다. 5.3절 Vision Inspection 최소 필드(`defect` 없음 등)는 factory-operations 소유라 이 변경에서 고치지 않았다.
  - integration: 2절·19.1절의 Vision FPS 측정과 Vision mAP 수집 대상이 없어진다. Ground Truth 검사 규칙에 Vision Result 예외와 추가 확인 항목을 반영한다. vision-inspection은 `products/`와 `ground_truth/`를 읽기만 하고 `gradcam/`에 쓰지 않으므로 Image Storage를 읽기 전용으로 마운트해도 된다(쓰기 권한은 모델 판정 복귀 때 필요).
  - predictive-maintenance: 영향 없음(2절 PdM 기준, 4.2 그대로).
  - 현재 범위 표시는 원래 설계 옆에 "제외"와 "비어 있음"을 붙이는 방식이다. 모델 판정 복귀는 새 DOCUMENT_CHANGE로 제안하며, 그때 Ground Truth 읽기 예외도 없어진다.
  - I-4(ISSUE-63f6789a…)와의 관계: Vision 처리 시각 필드는 두지 않는다(Vision Result timestamp). Vision의 오류 표현은 CONVENTIONS 오류 표현을 따른다. Q-11(Inspection Image), Q-17(6절 그림 문구), Vision 결과 지연 목표는 이 변경에서 정하지 않는다.
transition:
  adoption: |
    계약 변경 승인 책임자(@dltndn) 승인 후 merge. vision-inspection은 이 merge commit을 contract_ref로 채택하고 구현을 시작한다. factory-operations는 Shared 검토에서 이 Issue를 확인하고 Vision Result 구독을 이 형식으로 맞춘다. integration은 Ground Truth 검사 규칙과 Image Storage 마운트(vision-inspection 읽기 전용)를 반영한다.
    검증: 구현 뒤 integration이 COMPOSITION.json에 고정한 조합에서 7.2 흐름 E2E로 확인한다. 확인 항목은 가짜 렌더러 제품에 대한 Vision Result 발행, `defect`·`defect_type`이 Ground Truth 줄과 일치, null 필드와 `judgement_source`, Vision Result에 나머지 Ground Truth 필드 없음이다.
  rollback: |
    ARCHITECTURE 19절 복구 방법: 마지막으로 검증된 Component commit 조합과 계약 commit(8b1efb06325f711814152f4867d86e4413b4a404)으로 되돌린다. 운영 기간이므로 되돌리는 변경도 새 DOCUMENT_CHANGE로 게시한다. vision-inspection 구현이 아직 없으므로 되돌릴 Component 구현은 없다. factory-simulator 구현은 이 변경으로 바뀌지 않으므로 되돌릴 것이 없다.
